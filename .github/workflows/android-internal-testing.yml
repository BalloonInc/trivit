name: Android Internal Testing

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for internal testers'
        required: false
        default: 'Internal testing build'

defaults:
  run:
    working-directory: android

jobs:
  deploy:
    name: Build & Deploy to Internal Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build release bundle
        run: ./gradlew bundleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # TODO: Configure gradle-play-publisher plugin for automated deployment
      # Steps needed:
      # 1. Add the gradle-play-publisher plugin to build.gradle.kts:
      #    id("com.github.triplet.play") version "3.9.1"
      # 2. Configure the play block:
      #    play {
      #        serviceAccountCredentials.set(file("play-service-account.json"))
      #        track.set("internal")
      #        defaultToAppBundles.set(true)
      #    }
      # 3. Store service account JSON as a GitHub secret
      # 4. Replace the steps below with:
      #    ./gradlew publishBundle --no-daemon

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
